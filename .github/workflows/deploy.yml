name: ColdChain-Ops-Intelligence CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: false
        default: 'FDE-YT-Cold'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'FDE-YT-Cold' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ -d "/home/ubuntu/cold-chain-logistics-FDE-Project" ]; then
              cd /home/ubuntu/cold-chain-logistics-FDE-Project
            elif [ -d "/home/ubuntu/ColdChain-Ops-Intelligence-CCOI-" ]; then
              cd /home/ubuntu/ColdChain-Ops-Intelligence-CCOI-
            else
              cd /home/ubuntu/cold-chain-logistics*
            fi
            git pull origin main
            if [ -d "venv" ]; then
              source venv/bin/activate
            elif [ -d ".venv" ]; then
              source .venv/bin/activate
            fi
            pip install -r requirements.txt
            sudo systemctl restart streamlit
